<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Điểm Danh Công Việc Hàng Ngày - VKSND Khu Vực 5 Hải Phòng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- QR Generator & Camera QR Scanner -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="app"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDGKCjCLQ3dTjktrsbtTfTrbHeE6IhP5d4",
      authDomain: "grounded-style-452914-j7.firebaseapp.com",
      projectId: "grounded-style-452914-j7",
      storageBucket: "grounded-style-452914-j7.firebasestorage.app",
      messagingSenderId: "878838898371",
      appId: "1:878838898371:web:5c1e6147322c1473cd8c76",
      measurementId: "G-EBC1NTLP49"
    };

    const QR_DAILY_SALT = "VKSKV5_HP_CHAM_GIO_DEN_DAILY_SALT_2026";

    function computeDailyToken(dateStr) {
      const input = `${QR_DAILY_SALT}|${dateStr}|VKSKV5`;
      let h1 = 0x811c9dc5;
      let h2 = 0x01000193;
      for (let i = 0; i < input.length; i++) {
        const ch = input.charCodeAt(i);
        h1 ^= ch;
        h1 = Math.imul(h1, 0x01000193);
        h2 = Math.imul(h2 ^ ch, 0x85ebca6b);
      }
      const part1 = (h1 >>> 0).toString(16).toUpperCase().padStart(8, "0");
      const part2 = (h2 >>> 0).toString(16).toUpperCase().padStart(8, "0");
      return `VKSKV5-${dateStr.replace(/-/g, "")}-${part1}${part2}`;
    }

    function getDailyShortCode(dateStr) {
      const token = computeDailyToken(dateStr);
      const hexPart = token.split("-").pop() || "000000";
      return hexPart.slice(0, 6).toUpperCase();
    }

    function buildDailyQrPayload(dateStr) {
      return JSON.stringify({
        app: "VKSKV5_DIEMDANH",
        action: "ARRIVAL_CHECKIN",
        unit: "VKSND Khu vực 5 - Hải Phòng",
        date: dateStr,
        token: computeDailyToken(dateStr)
      });
    }

    let db = null;
    let firebaseConnected = false;
    try {
      if (window.firebase && firebase.apps && firebase.apps.length === 0) {
        firebase.initializeApp(firebaseConfig);
      }
      if (window.firebase && firebase.firestore) {
        db = firebase.firestore();
        firebaseConnected = true;
      }
    } catch (e) {
      console.error("Firebase init error:", e);
    }

    const TASKS = [
      {
        id: "qlvb",
        title: "Đăng nhập Phần mềm Quản lý văn bản",
        desc: "Kiểm tra văn bản đến, văn bản chỉ đạo và xử lý hồ sơ hành chính.",
        url: "https://qlvb.vksndtc.gov.vn/qlvbdh/main?lang=vi",
        hasVault: true
      },
      {
        id: "pmcv",
        title: "Đăng nhập Phần mềm Quản lý công việc",
        desc: "Cập nhật tiến độ công việc được giao trên Bàn làm việc số.",
        url: "https://banlamviecso.vksndtc.gov.vn/dashboard/",
        hasVault: true
      },
      {
        id: "luyenai",
        title: "Đăng nhập Phần mềm Luyện AI",
        desc: "Thực hành trợ lý ảo, tra cứu và ứng dụng AI trong công tác kiểm sát.",
        url: "https://banlamviecso.vksndtc.gov.vn/dashboard/",
        hasVault: true
      },
      {
        id: "rasoatan",
        title: "Rà soát án quá hạn",
        desc: "Kiểm tra thời hạn tạm giam, điều tra, truy tố, xét xử và nhập báo cáo kết quả.",
        url: null,
        hasVault: false,
        isInputTask: true
      }
    ];

    const todayStr = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };

    let html5QrScanner = null;
    let isScannerRunning = false;

    let state = {
      currentUser: JSON.parse(localStorage.getItem("vks_current_user") || "null"),
      authMode: "login",
      activeTab: "checkin",
      selectedDate: todayStr(),
      qrTargetDate: todayStr(),
      adminFilter: "all",
      adminSearch: "",
      users: JSON.parse(localStorage.getItem("vks_users") || "[]"),
      checkins: JSON.parse(localStorage.getItem("vks_checkins") || "{}"),
      vault: {},
      showPasswords: {},
      qrModalOpen: false,
      qrStatusMsg: "",
      arrivalCodeModalOpen: false,
      arrivalCodeInput: "",
      arrivalCodeError: "",
      toast: null
    };

    if (state.currentUser) {
      loadVaultForUser(state.currentUser.username);
    }

    function showToast(msg, type = "success") {
      state.toast = { msg, type };
      render();
      setTimeout(() => {
        state.toast = null;
        render();
      }, 3200);
    }

    function saveLocal() {
      localStorage.setItem("vks_users", JSON.stringify(state.users));
      localStorage.setItem("vks_checkins", JSON.stringify(state.checkins));
      if (state.currentUser) {
        localStorage.setItem("vks_current_user", JSON.stringify(state.currentUser));
      } else {
        localStorage.removeItem("vks_current_user");
      }
    }

    function saveVault() {
      if (!state.currentUser) return;
      const allVaults = JSON.parse(localStorage.getItem("vks_vault_by_user") || "{}");
      allVaults[state.currentUser.username] = state.vault;
      localStorage.setItem("vks_vault_by_user", JSON.stringify(allVaults));
    }

    function loadVaultForUser(username) {
      const allVaults = JSON.parse(localStorage.getItem("vks_vault_by_user") || "{}");
      state.vault = allVaults[username] || {
        qlvb: { url: "https://qlvb.vksndtc.gov.vn/qlvbdh/main?lang=vi", user: "", pass: "" },
        pmcv: { url: "https://banlamviecso.vksndtc.gov.vn/dashboard/", user: "", pass: "" },
        luyenai: { url: "https://banlamviecso.vksndtc.gov.vn/dashboard/", user: "", pass: "" }
      };
    }

    if (firebaseConnected && db) {
      try {
        db.collection("users").onSnapshot((snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          state.users = list;
          if (state.currentUser) {
            const updatedMe = list.find(u => u.username === state.currentUser.username);
            if (updatedMe) state.currentUser = updatedMe;
          }
          saveLocal();
          render();
        }, (err) => {
          console.warn("Firestore users sync fallback:", err.message);
        });

        db.collection("checkins").onSnapshot((snap) => {
          const map = {};
          snap.forEach((d) => {
            map[d.id] = d.data();
          });
          state.checkins = map;
          saveLocal();
          render();
        }, (err) => {
          console.warn("Firestore checkins sync fallback:", err.message);
        });
      } catch (err) {
        console.warn("Snapshot setup error:", err);
      }
    }

    async function syncUserToCloud(userObj) {
      const idx = state.users.findIndex(u => u.username === userObj.username);
      if (idx >= 0) state.users[idx] = userObj;
      else state.users.push(userObj);
      saveLocal();
      if (firebaseConnected && db) {
        try {
          await db.collection("users").doc(userObj.username).set(userObj);
        } catch (e) {
          console.warn("Cloud user save failed:", e);
        }
      }
    }

    async function deleteUserFromCloud(username) {
      state.users = state.users.filter(u => u.username !== username);
      saveLocal();
      if (firebaseConnected && db) {
        try {
          await db.collection("users").doc(username).delete();
        } catch (e) {
          console.warn("Cloud user delete failed:", e);
        }
      }
    }

    async function syncCheckinToCloud(key, record) {
      state.checkins[key] = record;
      saveLocal();
      if (firebaseConnected && db) {
        try {
          await db.collection("checkins").doc(key).set(record);
        } catch (e) {
          console.warn("Cloud checkin save failed:", e);
        }
      }
    }

    function getRecord(username, date) {
      const key = `${username}_${date}`;
      const existing = state.checkins[key] || {};
      return {
        username,
        date,
        arrival: existing.arrival || { checked: false, time: "", method: "" },
        tasks: {
          qlvb: { done: false, time: "", ...(existing.tasks?.qlvb || {}) },
          pmcv: { done: false, time: "", ...(existing.tasks?.pmcv || {}) },
          luyenai: { done: false, time: "", ...(existing.tasks?.luyenai || {}) },
          rasoatan: { done: false, time: "", note: "", ...(existing.tasks?.rasoatan || {}) }
        },
        updatedAt: existing.updatedAt || ""
      };
    }

    function nowTimeStr() {
      const d = new Date();
      return d.toTimeString().slice(0, 5);
    }

    function countDone(rec) {
      if (!rec || !rec.tasks) return 0;
      return TASKS.filter(t => rec.tasks[t.id]?.done).length;
    }

    function getStreak(username) {
      let streak = 0;
      const d = new Date();
      for (let i = 0; i < 60; i++) {
        const dt = new Date(d);
        dt.setDate(d.getDate() - i);
        const ds = dt.toISOString().split("T")[0];
        const rec = state.checkins[`${username}_${ds}`];
        if (countDone(rec) === 4) {
          streak++;
        } else if (i === 0) {
          continue;
        } else {
          break;
        }
      }
      return streak;
    }

    function hasExistingAdmin() {
      return state.users.some(u => u.role === "admin");
    }

    function validateDailyQrContent(decodedText, expectedDate) {
      const raw = (decodedText || "").trim();
      const expectedToken = computeDailyToken(expectedDate);
      if (raw === expectedToken) {
        return { valid: true, reason: "" };
      }
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.action === "ARRIVAL_CHECKIN") {
          if (parsed.date && parsed.date !== expectedDate) {
            return {
              valid: false,
              reason: `Mã QR này thuộc ngày ${parsed.date.split("-").reverse().join("/")}, không dùng cho ngày ${expectedDate.split("-").reverse().join("/")}.`
            };
          }
          if (parsed.token === expectedToken) {
            return { valid: true, reason: "" };
          }
        }
      } catch (e) {}
      return {
        valid: false,
        reason: `Mã QR không hợp lệ cho ngày ${expectedDate.split("-").reverse().join("/")}. Hãy quét mã QR báo giờ đến của đúng ngày hôm nay.`
      };
    }

    async function recordArrivalTime(methodLabel = "Quét mã QR theo ngày", targetDate = null) {
      if (!state.currentUser) return;
      const dateToUse = targetDate || state.selectedDate;
      const key = `${state.currentUser.username}_${dateToUse}`;
      const rec = JSON.parse(JSON.stringify(getRecord(state.currentUser.username, dateToUse)));
      const timeNow = nowTimeStr();
      rec.arrival = {
        checked: true,
        time: timeNow,
        method: methodLabel
      };
      rec.fullName = state.currentUser.fullName;
      rec.position = state.currentUser.position;
      rec.updatedAt = timeNow;
      await syncCheckinToCloud(key, rec);
      showToast(`Đã chấm báo giờ đến ngày ${dateToUse.split("-").reverse().join("/")} lúc ${timeNow} (${methodLabel})!`);
      render();
    }

    let activeMediaStream = null;
    let qrScanLoopId = null;
    let barcodeDetectorInstance = null;
    let fileQrScannerInstance = null;

    function setQrStatusText(msg) {
      state.qrStatusMsg = msg;
      const el = document.getElementById("qr-status-text");
      if (el) el.textContent = msg;
    }

    window.openArrivalCodeModal = () => {
      state.arrivalCodeModalOpen = true;
      state.arrivalCodeInput = "";
      state.arrivalCodeError = "";
      render();
      setTimeout(() => {
        const inp = document.getElementById("dailyArrivalCodeInput");
        if (inp) inp.focus();
      }, 50);
    };

    window.closeArrivalCodeModal = () => {
      state.arrivalCodeModalOpen = false;
      state.arrivalCodeInput = "";
      state.arrivalCodeError = "";
      render();
    };

    window.submitDailyArrivalCode = async (e) => {
      if (e) e.preventDefault();
      const rawCode = (document.getElementById("dailyArrivalCodeInput")?.value || "").trim().toUpperCase();
      const expectedCode = getDailyShortCode(state.selectedDate);
      const expectedFull = computeDailyToken(state.selectedDate).toUpperCase();
      const dateFormatted = state.selectedDate.split("-").reverse().join("/");

      if (!rawCode) {
        state.arrivalCodeError = `Vui lòng nhập mã báo giờ đến của ngày ${dateFormatted}.`;
        render();
        return;
      }

      if (rawCode === expectedCode || rawCode === expectedFull) {
        state.arrivalCodeModalOpen = false;
        state.arrivalCodeInput = "";
        state.arrivalCodeError = "";
        await recordArrivalTime(`Mã ngày ${dateFormatted} (${expectedCode})`, state.selectedDate);
      } else {
        state.arrivalCodeError = `Mã "${rawCode}" không đúng cho ngày ${dateFormatted}. Hãy kiểm tra lại mã của đúng ngày ${dateFormatted}.`;
        render();
      }
    };

    window.openQrScannerModal = async () => {
      state.qrModalOpen = true;
      state.qrStatusMsg = "Đang khởi động camera...";
      render();
      await startCameraQr();
    };

    window.closeQrScannerModal = async () => {
      await stopCameraQr();
      state.qrModalOpen = false;
      state.qrStatusMsg = "";
      render();
    };

    async function startCameraQr() {
      const readerEl = document.getElementById("qr-reader");
      if (!readerEl) return;

      await stopCameraQr();

      const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      if (!hasMediaDevices) {
        setQrStatusText("Trình duyệt không hỗ trợ mở camera trực tiếp (cần HTTPS hoặc chọn ảnh mã QR ngày hôm nay bên dưới).");
        return;
      }

      try {
        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
        } catch (e1) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
        }

        if (!state.qrModalOpen) {
          stream.getTracks().forEach(track => track.
